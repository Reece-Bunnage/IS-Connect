# Supabase CLI settings. Only used to deploy the Edge Functions
# (npm run deploy:calendar, npm run deploy:ai). The database is set up with the
# scripts in scripts/.
project_id = "IS-Connect"

[functions.calendar]
# Calendar apps fetch the link without logging in; the token in the link is the key.
verify_jwt = false

[functions.ai-openers]
# The function checks the IS-Connect login token sent in the request itself.
verify_jwt = false
